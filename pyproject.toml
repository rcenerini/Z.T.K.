[project]
name = "ztk"
version = "1.0.0"
description = "Zero Trust Kill — Sistema multiagente deterministico de analise e autocorrecao de seguranca de codigo"
requires-python = ">=3.12"
license = {text = "MIT"}
readme = "README.md"
keywords = ["security", "devsecops", "sast", "multi-agent", "pci-dss", "vulnerability-management"]
classifiers = [
    "Development Status :: 5 — Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
urls = {Repository = "https://github.com/rcenerini/Z.T.K."}

dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.5.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "bandit[toml]>=1.7.7",
    " moto>=5.0.0",
]
llm = [
    "vllm>=0.3.0",
    "transformers>=4.37.0",
    "torch>=2.2.0",
]
grafana = [
    "grafana-api>=1.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true

[tool.bandit]
exclude_dirs = ["tests", "scripts", ".venv"]
skips = ["B101"]  # assert usado em testes

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "contract: marks tests as contract tests",
    "security: marks tests as security tests",
    "fail_closed: marks tests that verify fail-closed behavior",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
fail_under = 85
skip_covered = false
show_missing = true
