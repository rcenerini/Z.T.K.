<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Z.T.K. e SAGA-SAGV_V2 — arquitetura complementar</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Diagrama comparando dois projetos irmãos com a mesma filosofia de segurança determinística. À esquerda, o Z.T.K., que detecta e corrige vulnerabilidades no próprio código-fonte através de agentes de SAST, PoC e geração de patch. À direita, o SAGA-SAGV_V2, que prioriza e responde a vulnerabilidades já conhecidas vindas de scanners externos como Veracode, Orca e Tenable, através de um motor de decisão SSVC determinístico. Uma seta central mostra o ponto de integração: achados confirmados do Z.T.K. entram no SAGA-SAGV_V2 como mais uma fonte de conector. Na base, os dois convergem para a mesma camada de contenção de borda (F5, Akamai, Azure WAF).</desc>
