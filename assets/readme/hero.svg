<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Z.T.K. — Zero Trust Kill</title>
  <desc id="hero-desc">Sistema multiagente deterministico de analise e autocorrecao de seguranca de codigo para ambiente de adquirencia e PCI DSS. Oito camadas de pipeline representadas como modulos conectados.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c12"/>
      <stop offset="100%" stop-color="#0f1923"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00a8cc"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#cc5522"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bg-grad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00d4ff" stroke-width="0.5"/>
  </g>

  <!-- Title block -->
  <g id="title-block" transform="translate(60 48)">
    <!-- Category label -->
    <text x="0" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#ff6b35" letter-spacing="2">DEVSECOPS · PCI DSS 4.0 · MULTI-AGENT SYSTEM</text>

    <!-- Project name -->
    <text x="0" y="78" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="56" font-weight="800" fill="#e6edf3" letter-spacing="-1">Z.T.K.</text>

    <!-- Subtitle -->
    <text x="0" y="112" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#8b949e">Zero Trust Kill</text>

    <!-- Description -->
    <text x="0" y="152" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" fill="#8b949e">
      Analise e autocorrecao deterministica de vulnerabilidades
    </text>
    <text x="0" y="176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" fill="#8b949e">
      por um sistema multiagente de 8 camadas
    </text>

    <!-- Metadata row -->
    <g transform="translate(0 200)">
      <rect x="0" y="0" width="48" height="4" rx="2" fill="url(#cyan-grad)"/>
      <text x="60" y="4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8b949e">PYTHON 3.12+ · AWS SERVERLESS · PDYANTIC V2 · BEDROCK</text>
    </g>
    <g transform="translate(0 216)">
      <rect x="0" y="0" width="48" height="4" rx="2" fill="url(#amber-grad)"/>
      <text x="60" y="4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8b949e">TERRAFORM 1.7+ · OPA/REGO · DYNAMODB · SQS</text>
    </g>
  </g>

  <!-- Layer architecture diagram (simplified) -->
  <g id="layers-diagram" transform="translate(680 56)">
    <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#8b949e" letter-spacing="1">ARQUITETURA</text>

    <!-- Layer cards -->
    <g transform="translate(0 12)">
      <rect x="0" y="0" width="200" height="22" rx="4" fill="#1a2332" stroke="#2a3a4a" stroke-width="0.5"/>
      <text x="8" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#00d4ff">L1</text>
      <text x="32" y="15" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e">Ingestão &amp; Triagem</text>
      <rect x="184" y="4" width="8" height="14" rx="2" fill="#00d4ff" opacity="0.3"/>
    </g>
    <g transform="translate(0 36)">
      <rect x="0" y="0" width="200" height="22" rx="4" fill="#1a2332" stroke="#2a3a4a" stroke-width="0.5"/>
      <text x="8" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#00d4ff">L2</text>
      <text x="32" y="15" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e">Especialistas SAST</text>
    </g>
    <g transform="translate(0 60)">
      <rect x="0" y="0" width="200" height="22" rx="4" fill="#1a2332" stroke="#2a3a4a" stroke-width="0.5"/>
      <text x="8" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#ff6b35">L3</text>
      <text x="32" y="15" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e">Validação &amp; PoC</text>
      <rect x="184" y="4" width="8" height="14" rx="2" fill="#ff6b35" opacity="0.3"/>
    </g>
    <g transform="translate(0 84)">
      <rect x="0" y="0" width="200" height="22" rx="4" fill="#1a2332" stroke="#2a3a4a" stroke-width="0.5"/>
      <text x="8" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#ff6b35">L4</text>
      <text x="32" y="15" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e">Consenso &amp; Debate</text>
    </g>
    <g transform="translate(0 108)">
      <rect x="0" y="0" width="200" height="22" rx="4" fill="#1a2332" stroke="#2a3a4a" stroke-width="0.5"/>
      <text x="8" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#00ff88">L5</text>
      <text x="32" y="15" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e">Remediação</text>
      <rect x="184" y="4" width="8" height="14" rx="2" fill="#00ff88" opacity="0.3"/>
    </g>
    <g transform="translate(0 132)">
      <rect x="0" y="0" width="200" height="22" rx="4" fill="#1a2332" stroke="#2a3a4a" stroke-width="0.5"/>
      <text x="8" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#00d4ff">L6</text>
      <text x="32" y="15" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e">Governança</text>
    </g>
    <g transform="translate(0 156)">
      <rect x="0" y="0" width="200" height="22" rx="4" fill="#1a2332" stroke="#2a3a4a" stroke-width="0.5"/>
      <text x="8" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#00d4ff">L7</text>
      <text x="32" y="15" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e">Model Ensemble</text>
    </g>
    <g transform="translate(0 180)">
      <rect x="0" y="0" width="200" height="22" rx="4" fill="#1a2332" stroke="#2a3a4a" stroke-width="0.5"/>
      <text x="8" y="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#00d4ff">L8</text>
      <text x="32" y="15" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#8b949e">Escala</text>
    </g>

    <!-- Cardinality labels -->
    <g transform="translate(210 0)">
      <text x="0" y="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#00d4ff" opacity="0.5">7 agents</text>
      <text x="0" y="64" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#ff6b35" opacity="0.5">18 agents</text>
      <text x="0" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#00ff88" opacity="0.5">2 trilhas</text>
      <text x="0" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#00d4ff" opacity="0.5">OPA</text>
    </g>

    <!-- Pipeline arrows (L1→L2→...→L8) -->
    <g opacity="0.15">
      <line x1="208" y1="11" x2="208" y2="47" stroke="#00d4ff" stroke-width="1"/>
      <polygon points="205,44 208,50 211,44" fill="#00d4ff"/>
      <line x1="208" y1="71" x2="208" y2="95" stroke="#ff6b35" stroke-width="1"/>
      <polygon points="205,92 208,98 211,92" fill="#ff6b35"/>
      <line x1="208" y1="119" x2="208" y2="143" stroke="#00ff88" stroke-width="1"/>
      <polygon points="205,140 208,146 211,140" fill="#00ff88"/>
    </g>
  </g>

  <!-- Bottom line -->
  <g transform="translate(60 330)">
    <rect x="0" y="0" width="80" height="2" rx="1" fill="url(#cyan-grad)" opacity="0.6"/>
    <rect x="88" y="0" width="40" height="2" rx="1" fill="url(#amber-grad)" opacity="0.4"/>
  </g>
</svg>
