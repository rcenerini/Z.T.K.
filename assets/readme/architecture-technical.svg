<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="740" viewBox="0 0 1200 740"
     role="img" aria-labelledby="tech-title tech-desc">
  <title id="tech-title">Z.T.K. Arquitetura Tecnica — Stack Completa</title>
  <desc id="tech-desc">Arquitetura tecnica do Z.T.K. VPC com 3 tiers (DMZ, APP, CDE PCI-DSS). Servicos AWS: Lambda, ECS Fargate, DynamoDB SSE-KMS, S3, SQS, Bedrock, vLLM local GPU. Fluxo de dados com barreiras de seguranca PCI DSS.</desc>

  <defs>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#00d4ff"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#00ff88"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#7b42bc"/></marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#ff6b35"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="740" rx="18" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="740" rx="18" fill="#FAFAFA" opacity="0.5"/>

  <!-- Title -->
  <text x="60" y="42" font-family="Montserrat,sans-serif" font-size="20" font-weight="700" fill="#0A0A0A">Arquitetura Técnica</text>
  <text x="260" y="42" font-family="IBM Plex Mono,monospace" font-size="10" fill="#9CA3AF">AWS Serverless + vLLM Local GPU · C4 Container Diagram · PCI DSS 1.3 Trust Boundary</text>
  <rect x="60" y="54" width="50" height="2" rx="1" fill="#00d4ff"/>

  <!-- ═══════════ VPC BOUNDARY ═══════════ -->
  <rect x="44" y="80" width="1112" height="600" rx="14" fill="none" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="68" y="102" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="700" fill="#0A0A0A">AWS VPC</text>
  <text x="160" y="102" font-family="IBM Plex Mono,monospace" font-size="8" fill="#9CA3AF">10.0.0.0/16 · us-east-1 · 3 Availability Zones</text>

  <!-- ═══════════ TIER 1: DMZ ═══════════ -->
  <rect x="68" y="116" width="1068" height="100" rx="8" fill="#F8F9FA" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="88" y="136" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="600" fill="#6B7280">DMZ — Public Subnets (10.0.1.0/24, 10.0.2.0/24)</text>

  <!-- Internet GW -->
  <rect x="88" y="152" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="106" y="172" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" fill="#0A0A0A">Internet Gateway</text>
  <text x="106" y="190" font-family="Inter,sans-serif" font-size="8" fill="#9CA3AF">Public internet access</text>

  <!-- WAF -->
  <rect x="300" y="152" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="318" y="172" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" fill="#0A0A0A">AWS WAF</text>
  <text x="318" y="190" font-family="Inter,sans-serif" font-size="8" fill="#9CA3AF">Containment rules (L5.B)</text>

  <!-- NAT GW -->
  <rect x="540" y="152" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="558" y="172" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" fill="#0A0A0A">NAT Gateway ×2</text>
  <text x="558" y="190" font-family="Inter,sans-serif" font-size="8" fill="#9CA3AF">Outbound only</text>

  <!-- ALB -->
  <rect x="760" y="152" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="778" y="172" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" fill="#0A0A0A">ALB</text>
  <text x="778" y="190" font-family="Inter,sans-serif" font-size="8" fill="#9CA3AF">TLS termination</text>

  <!-- ARROW: DMZ → APP -->
  <line x1="200" y1="218" x2="200" y2="254" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- ═══════════ TIER 2: APP + DATA FLOW ═══════════ -->
  <rect x="68" y="260" width="1068" height="170" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="88" y="280" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="600" fill="#6B7280">APP — Private Subnets (10.0.10.0/24, 10.0.11.0/24) · NAT Gateway</text>

  <!-- Lambda (TOP) -->
  <rect x="88" y="296" width="460" height="52" rx="8" fill="#FFFFFF" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="110" y="317" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700" fill="#0A0A0A">AWS Lambda</text>
  <text x="260" y="317" font-family="Inter,sans-serif" font-size="9" fill="#374151">Python 3.12+ · fail_closed · structlog</text>
  <text x="110" y="338" font-family="Inter,sans-serif" font-size="8" fill="#9CA3AF">L1 Ingest · L3 PoC · L4 Debate · L6 Policy · L7 Router · L8 Scale</text>

  <!-- ECS Fargate (TOP) -->
  <rect x="580" y="296" width="270" height="52" rx="8" fill="#FFFFFF" stroke="#7b42bc" stroke-width="1.5"/>
  <text x="600" y="317" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700" fill="#0A0A0A">ECS Fargate</text>
  <text x="710" y="317" font-family="Inter,sans-serif" font-size="9" fill="#374151">Spot · distroless</text>
  <text x="600" y="338" font-family="Inter,sans-serif" font-size="8" fill="#9CA3AF">L2 SAST Agents (Bandit, Semgrep, CodeQL, +21)</text>

