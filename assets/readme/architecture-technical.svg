  <text x="110" y="534" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700" fill="#0A0A0A">DynamoDB (SSE-KMS)</text>
  <text x="110" y="554" font-family="Inter,sans-serif" font-size="8" fill="#374151">findings · decisions · audit_events</text>
  <text x="110" y="570" font-family="Inter,sans-serif" font-size="8" fill="#374151">containment_rules · exceptions · PITR enabled</text>

  <!-- S3 -->
  <rect x="380" y="512" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#00d4ff" stroke-width="2"/>
  <text x="400" y="534" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700" fill="#0A0A0A">Amazon S3 (SSE-KMS)</text>
  <text x="400" y="554" font-family="Inter,sans-serif" font-size="8" fill="#374151">audit-trail (5yr lifecycle)</text>
  <text x="400" y="570" font-family="Inter,sans-serif" font-size="8" fill="#374151">evidence · lambda-artifacts</text>

  <!-- vLLM Local GPU -->
  <rect x="610" y="512" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#00ff88" stroke-width="2"/>
