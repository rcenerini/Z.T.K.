    <rect x="450" y="6" width="70" height="16" rx="3" fill="#FFF3E0"/>
    <text x="462" y="18" font-family="IBM Plex Mono,monospace" font-size="7" fill="#E65100">SAST</text>
    <text x="528" y="16" font-family="Inter,sans-serif" font-size="7" fill="#9CA3AF">→</text>
    <rect x="540" y="6" width="70" height="16" rx="3" fill="#FDE8E8"/>
    <text x="552" y="18" font-family="IBM Plex Mono,monospace" font-size="7" fill="#C62828">Secrets</text>
    <text x="618" y="16" font-family="Inter,sans-serif" font-size="7" fill="#9CA3AF">→</text>
    <rect x="630" y="6" width="70" height="16" rx="3" fill="#F3E8FF"/>
    <text x="642" y="18" font-family="IBM Plex Mono,monospace" font-size="7" fill="#6B21A8">OPA</text>
    <text x="708" y="16" font-family="Inter,sans-serif" font-size="7" fill="#9CA3AF">→</text>
    <rect x="720" y="6" width="70" height="16" rx="3" fill="#E8F4FD"/>
    <text x="732" y="18" font-family="IBM Plex Mono,monospace" font-size="7" fill="#0095CC">Terraform</text>
    <text x="798" y="16" font-family="Inter,sans-serif" font-size="7" fill="#9CA3AF">→</text>
    <rect x="810" y="6" width="80" height="16" rx="3" fill="#E6F9F0"/>
