  <rect x="320" y="606" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="340" y="621" font-family="Inter,sans-serif" font-size="8" fill="#374151">DynamoDB GW</text>
  <rect x="450" y="606" width="90" height="22" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="465" y="621" font-family="Inter,sans-serif" font-size="8" fill="#374151">S3 GW</text>
  <rect x="550" y="606" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="565" y="621" font-family="Inter,sans-serif" font-size="8" fill="#374151">SQS Interface</text>
  <rect x="660" y="606" width="110" height="22" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="675" y="621" font-family="Inter,sans-serif" font-size="8" fill="#374151">Bedrock Interface</text>
  <rect x="780" y="606" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="795" y="621" font-family="Inter,sans-serif" font-size="8" fill="#374151">KMS Interface</text>

