  <rect x="88" y="360" width="280" height="52" rx="8" fill="#FFFFFF" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="110" y="381" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700" fill="#0A0A0A">Amazon SQS</text>
  <text x="230" y="381" font-family="Inter,sans-serif" font-size="9" fill="#374151">6 filas + 6 DLQs</text>
  <text x="110" y="402" font-family="Inter,sans-serif" font-size="8" fill="#9CA3AF">ingestion · normalization · decision · copilot · hitl · remediation</text>

  <!-- EventBridge + Step Functions (MIDDLE) -->
  <rect x="400" y="360" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="420" y="381" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700" fill="#0A0A0A">EventBridge</text>
  <text x="420" y="402" font-family="Inter,sans-serif" font-size="8" fill="#9CA3AF">Pipeline orchestration</text>

  <rect x="650" y="360" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="670" y="381" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700" fill="#0A0A0A">Step Functions</text>
  <text x="670" y="402" font-family="Inter,sans-serif" font-size="8" fill="#9CA3AF">8 state machines</text>

  <!-- IAM + KMS -->
  <rect x="880" y="296" width="240" height="116" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="900" y="316" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="700" fill="#0A0A0A">IAM + KMS</text>
  <text x="900" y="336" font-family="Inter,sans-serif" font-size="8" fill="#374151">Lambda Execution Role</text>
  <text x="900" y="354" font-family="Inter,sans-serif" font-size="8" fill="#374151">ECS Task Role</text>
  <text x="900" y="372" font-family="Inter,sans-serif" font-size="8" fill="#374151">Bedrock Invoke Role</text>
  <text x="900" y="390" font-family="Inter,sans-serif" font-size="8" fill="#374151">KMS Key (rotation 365d)</text>
  <text x="900" y="406" font-family="IBM Plex Mono,monospace" font-size="7" fill="#9CA3AF">Least privilege · deny-by-default</text>

  <!-- ARROW: APP → CDE -->
  <line x1="200" y1="432" x2="200" y2="468" stroke="#ff6b35" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Trust Boundary Label -->
  <line x1="68" y1="450" x2="1136" y2="450" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="6,3"/>
  <rect x="490" y="442" width="220" height="16" rx="3" fill="#FEF2F2"/>
  <text x="500" y="454" font-family="IBM Plex Mono,monospace" font-size="8" font-weight="700" fill="#C62828">TRUST BOUNDARY — PCI DSS 1.3</text>

  <!-- ═══════════ TIER 3: CDE ═══════════ -->
  <rect x="68" y="472" width="1068" height="190" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.5"/>
  <text x="88" y="492" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="700" fill="#C62828">CDE — Cardholder Data Environment</text>
  <text x="340" y="492" font-family="IBM Plex Mono,monospace" font-size="8" fill="#9CA3AF">10.0.100.0/24, 10.0.101.0/24 · Sem internet · VPC Endpoints only</text>

