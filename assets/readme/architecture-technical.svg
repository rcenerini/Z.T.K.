  <text x="630" y="554" font-family="Inter,sans-serif" font-size="8" fill="#374151">EC2 g5.xlarge · Meta Llama 3.3 70B</text>
  <text x="630" y="570" font-family="Inter,sans-serif" font-size="8" fill="#374151">PCI/PII only · sem rede externa · efemero</text>

  <!-- Bedrock (non-CDE — allowed via VPC endpoint) -->
  <rect x="880" y="512" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#7b42bc" stroke-width="2"/>
  <text x="900" y="534" font-family="IBM Plex Mono,monospace" font-size="12" font-weight="700" fill="#0A0A0A">Amazon Bedrock</text>
  <text x="900" y="554" font-family="Inter,sans-serif" font-size="8" fill="#374151">Claude 3.5 Haiku + Sonnet</text>
  <text x="900" y="570" font-family="Inter,sans-serif" font-size="8" fill="#374151">NON-PCI only · via VPC Endpoint</text>

