<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="720" viewBox="0 0 1200 720"
     role="img" aria-labelledby="tech-title tech-desc">
  <title id="tech-title">Z.T.K. Arquitetura Tecnica — Stack Completa</title>
  <desc id="tech-desc">Arquitetura tecnica profunda do Z.T.K. mostrando servicos AWS (Lambda, ECS, DynamoDB, S3, SQS, Bedrock), infraestrutura on-prem (vLLM local GPU), barreiras de seguranca (CDE, VPC), e fluxo de dados entre componentes.</desc>

  <defs>
    <linearGradient id="cyang" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#0099cc"/></linearGradient>
    <linearGradient id="amberg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff6b35"/><stop offset="100%" stop-color="#cc4422"/></linearGradient>
    <linearGradient id="greeng" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00ff88"/><stop offset="100%" stop-color="#00cc66"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" rx="18" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="720" rx="18" fill="#F8F9FA" opacity="0.3"/>

  <!-- Title -->
  <text x="60" y="42" font-family="Montserrat,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#0A0A0A">Arquitetura Técnica — Stack AWS + vLLM Local</text>
  <text x="60" y="62" font-family="Inter,-apple-system,sans-serif" font-size="11" fill="#9CA3AF">Infraestrutura serverless com isolamento PCI DSS · 10 módulos Terraform · 7 pipelines CI/CD</text>
  <rect x="60" y="72" width="50" height="2" rx="1" fill="url(#amberg)"/>

  <!-- ====== VPC Boundary ====== -->
  <rect x="44" y="96" width="1112" height="560" rx="14" fill="none" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="68" y="116" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="600" fill="#9CA3AF">VPC (10.0.0.0/16) — us-east-1</text>

  <!-- ====== CDE Isolated Zone ====== -->
  <rect x="60" y="420" width="1080" height="220" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="84" y="442" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="700" fill="#C62828">CDE — Cardholder Data Environment (PCI DSS 1.3)</text>
  <text x="320" y="442" font-family="Inter,sans-serif" font-size="8" fill="#9CA3AF">Subnet isolada · sem rota para internet · apenas VPC endpoints</text>

  <!-- DMZ Subnet -->
  <rect x="80" y="136" width="1060" height="120" rx="8" fill="#F8F9FA" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="100" y="156" font-family="IBM Plex Mono,monospace" font-size="8" font-weight="600" fill="#9CA3AF">DMZ (10.0.1.0/24, 10.0.2.0/24) — Public Subnets</text>

  <!-- Internet GW -->
  <rect x="100" y="170" width="170" height="36" rx="6" fill="#FFFFFF" stroke="#00d4ff" stroke-width="1" filter="url(#shadow)"/>
  <text x="118" y="193" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="600" fill="#0A0A0A">Internet Gateway</text>

  <!-- WAF -->
  <rect x="290" y="170" width="170" height="36" rx="6" fill="#FFFFFF" stroke="#ff6b35" stroke-width="1" filter="url(#shadow)"/>
  <text x="308" y="186" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="600" fill="#0A0A0A">AWS WAF</text>
  <text x="308" y="200" font-family="Inter,sans-serif" font-size="7" fill="#9CA3AF">Containment rules (L5.B)</text>

  <!-- NAT GW -->
  <rect x="480" y="170" width="170" height="36" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
  <text x="498" y="193" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="600" fill="#0A0A0A">NAT Gateway (×2 AZ)</text>

  <!-- App Subnets -->
  <rect x="80" y="272" width="1060" height="134" rx="8" fill="#F8F9FA" stroke="#E5E7EB" stroke-width="0.5"/>
  <text x="100" y="290" font-family="IBM Plex Mono,monospace" font-size="8" font-weight="600" fill="#9CA3AF">APP (10.0.10.0/24, 10.0.11.0/24) — Private Subnets (com NAT)</text>

  <!-- Lambda -->
  <rect x="100" y="304" width="200" height="54" rx="8" fill="#FFFFFF" stroke="#00d4ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="118" y="322" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" fill="#0A0A0A">AWS Lambda</text>
  <text x="118" y="338" font-family="Inter,sans-serif" font-size="8" fill="#374151">L1, L3, L4, L6, L7, L8 handlers</text>
  <text x="118" y="352" font-family="IBM Plex Mono,monospace" font-size="7" fill="#9CA3AF">Python 3.12+ · fail_closed · structlog</text>

  <!-- ECS Fargate -->
  <rect x="330" y="304" width="200" height="54" rx="8" fill="#FFFFFF" stroke="#7b42bc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="348" y="322" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" fill="#0A0A0A">ECS Fargate</text>
  <text x="348" y="338" font-family="Inter,sans-serif" font-size="8" fill="#374151">L2 SAST Agents (24 containers)</text>
  <text x="348" y="352" font-family="IBM Plex Mono,monospace" font-size="7" fill="#9CA3AF">Spot · distroless · readOnlyRootFS</text>

  <!-- SQS -->
  <rect x="560" y="304" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#ff6b35" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="578" y="322" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" fill="#0A0A0A">Amazon SQS</text>
  <text x="578" y="338" font-family="Inter,sans-serif" font-size="8" fill="#374151">6 filas + 6 DLQs</text>
  <text x="578" y="352" font-family="IBM Plex Mono,monospace" font-size="7" fill="#9CA3AF">ingestion → copilot → hitl</text>

  <!-- EventBridge -->
  <rect x="765" y="304" width="160" height="54" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
  <text x="783" y="322" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" fill="#0A0A0A">EventBridge</text>
  <text x="783" y="338" font-family="Inter,sans-serif" font-size="8" fill="#374151">Pipeline orchestration</text>

    <!-- Step Functions -->
  <rect x="950" y="304" width="170" height="54" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
  <text x="968" y="322" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" fill="#0A0A0A">Step Functions</text>
  <text x="968" y="338" font-family="Inter,sans-serif" font-size="8" fill="#374151">8 state machines</text>

  <!-- ====== vLLM Local (GPU) ====== -->
  <rect x="180" y="460" width="240" height="90" rx="8" fill="#FFFFFF" stroke="#00ff88" stroke-width="2" filter="url(#shadow)"/>
  <rect x="180" y="460" width="240" height="24" rx="8" fill="#E6F9F0"/>
  <rect x="180" y="476" width="240" height="8" fill="#E6F9F0"/>
  <text x="198" y="478" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" fill="#0A0A0A">vLLM Local — GPU (EC2 g5.xlarge)</text>
  <text x="198" y="500" font-family="Inter,sans-serif" font-size="8" fill="#374151">Meta Llama 3.3 70B Instruct</text>
  <text x="198" y="516" font-family="Inter,sans-serif" font-size="8" fill="#374151">🔒 Sem rede externa · storage efêmero</text>
  <text x="198" y="532" font-family="Inter,sans-serif" font-size="8" fill="#374151">PCI/PII apenas — roteamento forçado</text>
  <text x="198" y="546" font-family="IBM Plex Mono,monospace" font-size="7" fill="#9CA3AF">Firecracker microVM · seccomp strict</text>

  <!-- Bedrock -->
  <rect x="480" y="460" width="240" height="90" rx="8" fill="#FFFFFF" stroke="#7b42bc" stroke-width="2" filter="url(#shadow)"/>
  <rect x="480" y="460" width="240" height="24" rx="8" fill="#F3E8FF"/>
  <rect x="480" y="476" width="240" height="8" fill="#F3E8FF"/>
  <text x="498" y="478" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" fill="#0A0A0A">Amazon Bedrock (us-east-1)</text>
  <text x="498" y="500" font-family="Inter,sans-serif" font-size="8" fill="#374151">Claude 3.5 Haiku (volume)</text>
  <text x="498" y="516" font-family="Inter,sans-serif" font-size="8" fill="#374151">Claude 3.5 Sonnet (reasoning)</text>
  <text x="498" y="532" font-family="Inter,sans-serif" font-size="8" fill="#374151">Apenas dados NON-PCI</text>
  <text x="498" y="546" font-family="IBM Plex Mono,monospace" font-size="7" fill="#9CA3AF">Guardrails · prompt caching</text>

  <!-- DynamoDB in CDE -->
  <rect x="780" y="460" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#00d4ff" stroke-width="2" filter="url(#shadow)"/>
  <rect x="780" y="460" width="220" height="24" rx="8" fill="#E8F4FD"/>
  <rect x="780" y="476" width="220" height="8" fill="#E8F4FD"/>
  <text x="798" y="478" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" fill="#0A0A0A">DynamoDB (SSE-KMS)</text>
  <text x="798" y="500" font-family="Inter,sans-serif" font-size="8" fill="#374151">5 tabelas + GSI + PITR</text>
  <text x="798" y="516" font-family="Inter,sans-serif" font-size="8" fill="#374151">findings · decisions · audit_events</text>
  <text x="798" y="532" font-family="Inter,sans-serif" font-size="8" fill="#374151">containment_rules · exceptions</text>
  <text x="798" y="546" font-family="IBM Plex Mono,monospace" font-size="7" fill="#9CA3AF">on-demand · tenant_id PK</text>

  <!-- S3 in CDE -->
  <rect x="1020" y="460" width="100" height="90" rx="8" fill="#FFFFFF" stroke="#00d4ff" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="490" font-family="IBM Plex Mono,monospace" font-size="10" font-weight="700" fill="#0A0A0A" text-anchor="middle">S3</text>
  <text x="1070" y="506" font-family="Inter,sans-serif" font-size="7" fill="#374151" text-anchor="middle">Audit Trail</text>
  <text x="1070" y="520" font-family="Inter,sans-serif" font-size="7" fill="#374151" text-anchor="middle">Evidence</text>
  <text x="1070" y="534" font-family="Inter,sans-serif" font-size="7" fill="#374151" text-anchor="middle">Artifacts</text>
  <text x="1070" y="546" font-family="IBM Plex Mono,monospace" font-size="7" fill="#9CA3AF" text-anchor="middle">SSE-KMS</text>

