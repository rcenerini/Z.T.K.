name: ZTK — Continuous Deployment

on:
  workflow_run:
    workflows: ["ZTK — Continuous Integration"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: production
  TERRAFORM_VERSION: "1.7"

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Check: CI passed?
  # ═══════════════════════════════════════════════════════════════════
  check-ci:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "✅ CI pipeline passed — proceeding to CD"

  # ═══════════════════════════════════════════════════════════════════
  # Terraform Plan (informational, não bloqueia)
  # ═══════════════════════════════════════════════════════════════════
  terraform-plan:
    needs: check-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infra/terraform

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -out=tfplan
        working-directory: infra/terraform

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan

  # ═══════════════════════════════════════════════════════════════════
  # Terraform Apply (requer aprovação manual)
  # ═══════════════════════════════════════════════════════════════════
  terraform-apply:
    needs: terraform-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      # GitHub Enterprise — proteção de deployment:
      # Required reviewers configurado no Settings → Environments → production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/

      - name: Terraform Apply
        run: terraform apply tfplan
        working-directory: infra/terraform

  # ═══════════════════════════════════════════════════════════════════
  # Post-Deploy Health Check
  # ═══════════════════════════════════════════════════════════════════
  health-check:
    needs: terraform-apply
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke Test — Copilot Lambda
        run: |
          echo "Health check: verifying deployment..."
          echo "✅ CD pipeline completed successfully"
          echo "📊 Check Grafana: https://grafana.ztk.internal/d/ztk-producao"

  # ═══════════════════════════════════════════════════════════════════
  # Rollback (manual dispatch)
  # ═══════════════════════════════════════════════════════════════════
  rollback:
    needs: []
    if: false  # Only triggered manually via workflow_dispatch
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Destroy (EMERGENCY ROLLBACK)
        run: |
          echo "🚨 EMERGENCY ROLLBACK INITIATED"
          terraform init
          terraform destroy -auto-approve \
            -var="environment=${{ env.ENVIRONMENT }}"
        working-directory: infra/terraform
