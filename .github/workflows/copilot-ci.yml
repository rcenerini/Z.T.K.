name: Copilot CI/CD

on:
  push:
    branches: [main]
    paths:
      - "mvp2/copilot/**"
  pull_request:
    branches: [main]
    paths:
      - "mvp2/copilot/**"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings boto3 pytest pytest-mock
          pip install mypy ruff bandit

      - name: Lint (ruff)
        run: python -m ruff check mvp2/copilot/src/

      - name: Type check (mypy)
        run: python -m mypy mvp2/copilot/src/copilot/ --strict --ignore-missing-imports || true
        continue-on-error: true

      - name: Unit tests (pytest)
        run: |
          PYTHONPATH=mvp2/copilot/src python -m pytest mvp2/copilot/tests/test_copilot.py -v --tb=short --cov=mvp2/copilot/src/copilot --cov-report=term --cov-report=xml:coverage.xml
        env:
          COPILOT_BEDROCK_REGION: us-east-1

      - name: Security SAST (bandit)
        run: python -m bandit -r mvp2/copilot/src/copilot/ -ll -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Secret scan
        run: |
          ! grep -r "verify=False" --include="*.py" mvp2/copilot/
          ! grep -rP "(api_key|password|token)\s*=\s*['\"]" --include="*.py" mvp2/copilot/ || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
