name: ZTK — Continuous Integration

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Brainstorming/**"
      - "assets/**"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.8"

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Gate 1: Lint + Typecheck (rápido, paralelo)
  # ═══════════════════════════════════════════════════════════════════
  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install ruff mypy pydantic pydantic-settings boto3 structlog

      - name: Lint — Ruff
        run: ruff check src/ mvp2/

      - name: Typecheck — MyPy (MVP2 Copilot)
        run: mypy mvp2/copilot/src/copilot/ --strict --ignore-missing-imports
        continue-on-error: true

      - name: Typecheck — MyPy (Shared)
        run: mypy src/shared/ --strict --ignore-missing-imports
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════
  # Gate 2: Unit Tests (paralelo por módulo)
  # ═══════════════════════════════════════════════════════════════════
  unit-tests:
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: "MVP2 Copilot"
            path: "mvp2/copilot/tests/"
            pythonpath: "mvp2/copilot/src"
          - name: "Shared Schemas"
            path: "tests/unit/shared/"
            pythonpath: "src"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install pydantic pydantic-settings boto3 structlog pytest pytest-mock pytest-cov

      - name: Test — ${{ matrix.module.name }}
        run: |
          PYTHONPATH=${{ matrix.module.pythonpath }} \
          pytest ${{ matrix.module.path }} \
            -v \
            --tb=short \
            --cov=${{ matrix.module.pythonpath }} \
            --cov-report=term \
            --cov-report=xml:coverage-${{ matrix.module.name }}.xml \
            --cov-fail-under=60
        env:
          COPILOT_BEDROCK_REGION: us-east-1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module.name }}
          path: coverage-${{ matrix.module.name }}.xml

  # ═══════════════════════════════════════════════════════════════════
  # Gate 3: Security SAST
  # ═══════════════════════════════════════════════════════════════════
  security-sast:
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit

      - name: SAST — Bandit (MVP2)
        run: bandit -r mvp2/copilot/src/ -ll -f json -o bandit-mvp2.json
        continue-on-error: true

      - name: SAST — Bandit (Shared)
        run: bandit -r src/shared/ -ll -f json -o bandit-shared.json
        continue-on-error: true

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: bandit-*.json

  # ═══════════════════════════════════════════════════════════════════
  # Gate 4: Secret Scan (BLOQUEANTE)
  # ═══════════════════════════════════════════════════════════════════
  secret-scan:
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan — detect-secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files --exclude-files '\.svg$|dummy\.zip$|\.pytest_cache|__pycache__' > secrets-report.json
        continue-on-error: true

      - name: Manual grep for critical patterns
        run: |
          echo "=== Checking for verify=False ==="
          ! grep -r "verify=False" --include="*.py" src/ mvp2/ || (echo "❌ CRITICAL: verify=False found" && exit 1)
          echo "=== Checking for hardcoded API keys ==="
          ! grep -rP "(api_key|password|token|secret)\s*=\s*['\"][^$]" --include="*.py" src/ mvp2/ || (echo "❌ CRITICAL: Potential hardcoded credential" && exit 1)
          echo "=== Checking for eval/exec with input ==="
          ! grep -rP "\b(eval|exec)\s*\(" --include="*.py" src/ mvp2/ || (echo "⚠️  WARNING: eval/exec usage detected" && exit 0)
          echo "✅ Secret scan passed"

  # ═══════════════════════════════════════════════════════════════════
  # Gate 5: OPA Policy Tests
  # ═══════════════════════════════════════════════════════════════════
  opa-tests:
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v1.3.0/opa_linux_amd64_static
          chmod +x opa

      - name: OPA Test
        run: ./opa test infra/policies/ tests/policy/ -v

  # ═══════════════════════════════════════════════════════════════════
  # Gate 6: Terraform Validate
  # ═══════════════════════════════════════════════════════════════════
  terraform-validate:
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: infra/terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/terraform

  # ═══════════════════════════════════════════════════════════════════
  # Gate 7: Regression Gate (todos os gates passaram?)
  # ═══════════════════════════════════════════════════════════════════
  regression-gate:
    needs:
      - lint-and-types
      - unit-tests
      - security-sast
      - secret-scan
      - opa-tests
      - terraform-validate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all gates
        run: |
          echo "=== ZTK CI Pipeline Gates ==="
          echo "lint-and-types:     ${{ needs.lint-and-types.result }}"
          echo "unit-tests:         ${{ needs.unit-tests.result }}"
          echo "security-sast:      ${{ needs.security-sast.result }}"
          echo "secret-scan:        ${{ needs.secret-scan.result }}"
          echo "opa-tests:          ${{ needs.opa-tests.result }}"
          echo "terraform-validate: ${{ needs.terraform-validate.result }}"

          if [[ "${{ needs.lint-and-types.result }}" != "success" ]] ||
             [[ "${{ needs.unit-tests.result }}" != "success" ]] ||
             [[ "${{ needs.secret-scan.result }}" != "success" ]] ||
             [[ "${{ needs.opa-tests.result }}" != "success" ]] ||
             [[ "${{ needs.terraform-validate.result }}" != "success" ]]; then
            echo "❌ REGRESSION GATE FAILED"
            exit 1
          fi
          echo "✅ ALL GATES PASSED"
